# Redirect non-www → www (canonical domain)
server {
    listen 80;
    listen 443 ssl http2;
    server_name teskilat.com.tr;

    ssl_certificate /etc/letsencrypt/live/test.teskilat.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.teskilat.com.tr/privkey.pem;

    return 301 https://www.teskilat.com.tr$request_uri;
}

server {
    listen 80;
    server_name test.teskilat.com.tr www.teskilat.com.tr;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.teskilat.com.tr;

    # SSL certificates (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/test.teskilat.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.teskilat.com.tr/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Frontend root
    root /var/www/teskilat/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy to backend
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Uploads proxy (if served from backend)
    location /uploads/ {
        proxy_pass http://localhost:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # 301 Redirects: Old Umbraco URLs → New React routes
    # Helps Google deindex old pages and transfer SEO value
    # ============================================================

    # -- Primary English page redirects --
    location = /what-we-do          { return 301 /services; }
    location = /who-we-are          { return 301 /about; }
    location = /our-work            { return 301 /works; }
    location = /our-team            { return 301 /team; }
    location = /our-brands          { return 301 /brands; }
    location = /contact-us          { return 301 /contact; }
    location = /icom                { return 301 /icom-network; }
    location = /icom-network-member { return 301 /icom-network; }
    location = /kvkk                { return 301 /; }
    location = /about-us            { return 301 /about; }
    location = /portfolio           { return 301 /works; }
    location = /careers             { return 301 /; }

    # -- Common Umbraco default paths --
    location = /home                { return 301 /; }
    location = /default             { return 301 /; }
    location = /default.aspx        { return 301 /; }
    location = /homepage            { return 301 /; }
    location = /index               { return 301 /; }
    location = /index.html          { return 301 /; }

    # -- Turkish-language URL slugs (if old site used them) --
    location = /hakkimizda          { return 301 /about; }
    location = /hizmetlerimiz       { return 301 /services; }
    location = /ekibimiz            { return 301 /team; }
    location = /markalarimiz        { return 301 /brands; }
    location = /islerimiz           { return 301 /works; }
    location = /iletisim            { return 301 /contact; }
    location = /haberler            { return 301 /news; }

    # -- Catch-all for old sub-paths (e.g. /what-we-do/strategy) --
    location ^~ /what-we-do/        { return 301 /services; }
    location ^~ /who-we-are/        { return 301 /about; }
    location ^~ /our-work/          { return 301 /works; }
    location ^~ /our-team/          { return 301 /team; }
    location ^~ /our-brands/        { return 301 /brands; }

    # ============================================================
    # Block old Umbraco system paths (return 410 Gone)
    # Tells search engines these resources are permanently gone
    # ============================================================
    location /umbraco               { return 410; }
    location /media                 { return 410; }
    location /App_Plugins           { return 410; }
    location /App_Data              { return 410; }
    location /bin                   { return 410; }
    location /Views                 { return 410; }
    location ~* \.aspx$             { return 410; }

    # SPA fallback - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webm|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
